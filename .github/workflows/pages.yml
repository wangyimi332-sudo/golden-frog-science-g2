name: Publish G2 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published website and media
        shell: python
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          import hashlib, os, time, urllib.request
          from pathlib import Path
          from urllib.parse import urljoin
          base = os.environ["SITE_URL"].rstrip("/") + "/"
          for name in ["index.html", "learning.js", "assets/golden-frog.webp", "audio/af_bella-a1-intro.mp3"]:
              expected = hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest()
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(urljoin(base, name), headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read()
                          assert response.status == 200
                      assert hashlib.sha256(body).hexdigest() == expected, "Content mismatch"
                      print(f"OK {name}: {len(body)} bytes, SHA-256 matches")
                      break
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(5)
          print(f"Verified live website: {base}")
